<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live readout dividers — ideas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root[data-theme="light"]{ --bg:#F4F3EF; --elev:#FFFFFF; --fg:#14140F; --dim:#6E6B60; --faint:#A8A496; --rule:#E2E0D8; --hair:#ECEAE3; --ink-rgb:20,20,15; }
  :root[data-theme="dark"]{ --bg:#121213; --elev:#1E1E20; --fg:#ECECEA; --dim:#9A9A93; --faint:#6A6A62; --rule:#2A2A2C; --hair:#202022; --ink-rgb:236,236,234; }
  :root{ --mono:'DM Mono',ui-monospace,monospace; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--mono);-webkit-font-smoothing:antialiased;font-size:14px;}
  .chrome{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:14px 22px;background:var(--bg);border-bottom:1px solid var(--rule);flex-wrap:wrap;}
  .chrome .t{font-size:12px;letter-spacing:.16em;text-transform:uppercase;}
  .seg{display:flex;gap:4px;margin-left:6px;flex-wrap:wrap;}
  .seg button{font:inherit;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);background:none;border:1px solid var(--rule);border-radius:7px;padding:6px 11px;cursor:pointer;}
  .seg button.on{color:var(--bg);background:var(--fg);border-color:var(--fg);}
  .chrome .tgl{margin-left:auto;font:inherit;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);background:none;border:0;cursor:pointer;}
  .stage{max-width:880px;margin:0 auto;padding:26px 22px 60px;}
  .cap{font-size:12px;letter-spacing:.02em;color:var(--dim);margin:0 0 18px;line-height:1.5;}
  .cap b{color:var(--fg);font-weight:500;}

  /* framed live screen */
  .screen{border:1px solid var(--rule);border-radius:18px;background:var(--bg);padding:22px 24px 24px;}
  .ltop{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
  .ltop .wk{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);}
  .ltop .seg-name{flex:1;text-align:center;font-size:21px;font-weight:500;letter-spacing:-.01em;color:var(--fg);}
  .ltop .end{font-size:12px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--fg);color:var(--fg);background:none;border-radius:7px;padding:9px 18px;cursor:pointer;}

  /* stub chart */
  .chart{height:120px;display:flex;align-items:flex-end;gap:2px;border-bottom:1px solid var(--rule);margin-bottom:18px;}
  .chart i{flex:1;background:color-mix(in srgb,var(--fg) 46%,transparent);}
  .chart i.hot{background:color-mix(in srgb,var(--fg) 20%,transparent);}

  /* ===== the metric grid (the thing we're sectioning) ===== */
  .grid{display:grid;grid-template-columns:repeat(12,1fr);margin-bottom:20px;}
  .cell{min-width:0;display:flex;flex-direction:column;padding:14px 2px;}
  .cell.hero{grid-column:span 6;}
  .cell:not(.hero){grid-column:span 3;}
  .lab{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:8px;}
  .sub{font-size:11px;color:var(--faint);margin-bottom:6px;letter-spacing:.02em;}
  .val{font-size:34px;font-weight:500;letter-spacing:-.02em;line-height:1;margin-top:auto;color:var(--fg);}
  .cell.hero .val{font-size:58px;}
  .val u{text-decoration:none;font-size:.32em;color:var(--dim);margin-left:4px;}
  .bar{height:4px;background:color-mix(in srgb,var(--fg) 9%,transparent);border-radius:2px;margin-top:10px;overflow:hidden;}
  .bar i{display:block;height:100%;background:var(--fg);opacity:.75;}

  /* ---------- NOW: borderless (current) ---------- */
  .grid.now{gap:14px;}

  /* ---------- A: spreadsheet (connected hairline grid) ---------- */
  .grid.a{gap:0;border-top:1px solid var(--rule);border-left:1px solid var(--rule);border-radius:12px;overflow:hidden;}
  .grid.a .cell{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:16px 18px;}

  /* ---------- B: outlined chips ---------- */
  .grid.b{gap:12px;}
  .grid.b .cell{border:1px solid var(--rule);border-radius:12px;padding:15px 16px;}

  /* ---------- C: ruled (dividers only, no outer box) ---------- */
  .grid.c{gap:0;}
  .grid.c .cell{border-right:1px solid var(--rule);padding:16px 18px;}
  .grid.c .cell:nth-child(2),.grid.c .cell:nth-child(6){border-right:0;}
  .grid.c .cell:nth-child(1),.grid.c .cell:nth-child(2){border-bottom:1px solid var(--rule);}

  /* ---------- D: filled tiles (soft panels, no borders) ---------- */
  .grid.d{gap:10px;}
  .grid.d .cell{background:var(--elev);border-radius:12px;padding:15px 16px;}
  :root[data-theme="dark"] .grid.d .cell{background:var(--elev);}
  .grid.d .cell.hero{background:color-mix(in srgb,var(--fg) 6%,transparent);}

  /* ---------- E: hero boxed, rest ruled ---------- */
  .grid.e{gap:12px;}
  .grid.e .cell{padding:14px 16px;}
  .grid.e .cell.hero{border:1px solid var(--rule);border-radius:12px;}
  .grid.e .cell:not(.hero){border-top:1px solid var(--rule);border-radius:0;padding-top:14px;}

  .controls{display:flex;gap:12px;}
  .btn{flex:1;font:inherit;font-size:13px;letter-spacing:.1em;text-transform:uppercase;padding:16px;border-radius:9px;border:1px solid var(--rule);background:none;color:var(--fg);cursor:pointer;}
  .btn.pause{border-color:var(--fg);}
</style>
</head>
<body>
  <div class="chrome">
    <span class="t">Live readout dividers</span>
    <span class="seg" id="seg">
      <button data-d="now" class="on">Now</button>
      <button data-d="a">A · Spreadsheet</button>
      <button data-d="b">B · Chips</button>
      <button data-d="c">C · Ruled</button>
      <button data-d="d">D · Filled tiles</button>
      <button data-d="e">E · Hero boxed</button>
    </span>
    <button class="tgl" id="theme">Dark</button>
  </div>
  <div class="stage">
    <p class="cap" id="cap"></p>
    <div class="screen">
      <div class="ltop">
        <span class="wk">Ashglow</span>
        <span class="seg-name">Threshold</span>
        <button class="end">End</button>
      </div>
      <div class="chart" id="chart"></div>
      <div class="grid now" id="grid">
        <div class="cell hero"><span class="lab">Interval</span><span class="sub">Next · Over-under — 2 min</span><span class="val">04:12</span></div>
        <div class="cell hero"><span class="lab">Cadence</span><span class="val">92<u>rpm</u></span></div>
        <div class="cell"><span class="lab">Elapsed</span><span class="val">18:40</span></div>
        <div class="cell"><span class="lab">Heart Rate</span><span class="val">156<u>bpm</u></span></div>
        <div class="cell"><span class="lab">Target</span><span class="val">250<u>w</u></span></div>
        <div class="cell"><span class="lab">Power</span><span class="val">243<u>w</u></span><div class="bar"><i style="width:72%"></i></div></div>
      </div>
      <div class="controls">
        <button class="btn">Skip ▸▸</button>
        <button class="btn pause">Pause</button>
      </div>
    </div>
  </div>
<script>
  var H=[34,46,54,62,62,46,82,82,46,82,82,46,78,78,46,62,62,48,58,58,44,40,34,30];
  document.getElementById('chart').innerHTML=H.map(function(h){var hot=h>=70?' class="hot"':'';return '<i'+hot+' style="height:'+h+'%"></i>';}).join('');
  var CAP={
    now:'<b>Now.</b> The readouts float with only whitespace between them — no sectioning, which is what feels loose.',
    a:'<b>A · Spreadsheet.</b> A connected hairline grid, like a table: every cell bordered, nothing floating. Most structured and "instrument panel".',
    b:'<b>B · Chips.</b> Each readout in its own outlined rounded card with gaps. Clear separation, a little softer and more modular.',
    c:'<b>C · Ruled.</b> Just the dividing lines — verticals between cells, a rule between the two rows, no outer box. Quietest; keeps the open feel but sections it.',
    d:'<b>D · Filled tiles.</b> Soft filled panels, no borders; the two hero cells get a touch more fill. Reads as blocks without hard lines.',
    e:'<b>E · Hero boxed.</b> Only the two big cells are boxed; the four small ones sit under a hairline rule. Emphasis on what you watch most.'
  };
  function show(d){document.getElementById('grid').className='grid '+d;document.getElementById('cap').innerHTML=CAP[d];}
  document.getElementById('seg').addEventListener('click',function(e){var b=e.target.closest('button[data-d]');if(!b)return;[].forEach.call(this.children,function(x){x.classList.toggle('on',x===b);});show(b.getAttribute('data-d'));});
  document.getElementById('theme').addEventListener('click',function(){var d=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',d);this.textContent=d==='light'?'Dark':'Light';});
  show('now');
</script>
</body>
</html>
