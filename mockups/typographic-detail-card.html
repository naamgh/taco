<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detail card — layout ideas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root[data-theme="light"]{ --bg:#F4F3EF; --elev:#FFFFFF; --fg:#14140F; --strong:#14140F; --dim:#6E6B60; --faint:#A8A496; --rule:#E2E0D8; --hair:#ECEAE3; }
  :root[data-theme="dark"]{ --bg:#121213; --elev:#1E1E20; --fg:#ECECEA; --strong:#F2F2F0; --dim:#9A9A93; --faint:#6A6A62; --rule:#2A2A2C; --hair:#202022; }
  :root{ --mono:'DM Mono',ui-monospace,monospace; --tempo:#49B4B0; --endurance:#5B8DEF; --rec:#9AA0AD; --spice:#E8395A; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--mono);-webkit-font-smoothing:antialiased;font-size:14px;}
  .chrome{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:14px 22px;background:var(--bg);border-bottom:1px solid var(--rule);flex-wrap:wrap;}
  .chrome .t{font-size:12px;letter-spacing:.16em;text-transform:uppercase;}
  .seg{display:flex;gap:4px;margin-left:6px;flex-wrap:wrap;}
  .seg button{font:inherit;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);background:none;border:1px solid var(--rule);border-radius:7px;padding:6px 11px;cursor:pointer;}
  .seg button.on{color:var(--bg);background:var(--fg);border-color:var(--fg);}
  .chrome .tgl{margin-left:auto;font:inherit;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);background:none;border:0;cursor:pointer;}
  .stage{max-width:1120px;margin:0 auto;padding:24px 22px 60px;}
  .cap{font-size:12px;letter-spacing:.02em;color:var(--dim);margin:0 0 16px;line-height:1.5;}
  .cap b{color:var(--fg);font-weight:500;}

  /* a framed "row + expand" like the real list */
  .card{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);background:var(--bg);padding:26px 4px 30px;}

  .name{font-family:var(--mono);font-size:30px;font-weight:500;letter-spacing:-.01em;color:var(--strong);margin:0;line-height:1.05;}
  .zbadge{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);}
  .zbadge i{width:9px;height:9px;border-radius:2px;background:var(--tempo);}
  .chip{display:inline-block;border:1px solid var(--rule);border-radius:6px;font-size:12px;letter-spacing:.02em;color:var(--dim);padding:6px 11px;}
  .struct{font-size:12.5px;color:var(--dim);letter-spacing:.02em;}
  .spice{display:inline-flex;gap:2px;vertical-align:middle;}
  .spice b{width:9px;height:12px;background:var(--spice);display:inline-block;border-radius:2px 2px 4px 4px;clip-path:polygon(50% 0,100% 35%,78% 100%,22% 100%,0 35%);opacity:.9;}
  .spice b.off{background:none;border:1px solid var(--rule);}
  .cue{font-size:14px;line-height:1.6;color:var(--dim);max-width:46ch;margin:16px 0 22px;}

  /* specs — borderless big numbers (row) */
  .specs{display:flex;gap:40px;flex-wrap:wrap;margin:0 0 22px;}
  .specs .s .k{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);}
  .specs .s .v{font-size:24px;font-weight:500;letter-spacing:-.01em;color:var(--strong);margin-top:7px;}
  .specs .s .v u{text-decoration:none;font-size:.55em;color:var(--dim);margin-left:2px;}
  /* specs — bordered grid (spreadsheet) */
  .specs.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border-top:1px solid var(--rule);border-left:1px solid var(--rule);border-radius:10px;overflow:hidden;max-width:620px;}
  .specs.grid .s{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:12px 14px;}
  .specs.grid .s .v{font-size:21px;margin-top:6px;}
  /* specs — hairline strip under the chart */
  .specs.strip{display:grid;grid-template-columns:repeat(5,auto);justify-content:start;gap:0 40px;border-top:1px solid var(--rule);padding-top:16px;margin-top:4px;}

  .act{display:flex;align-items:center;gap:16px;}
  .start{font-family:var(--mono);font-size:12.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;padding:12px 24px;border-radius:6px;border:1px solid var(--strong);background:none;color:var(--strong);cursor:pointer;}
  .start:hover{background:var(--strong);color:var(--bg);}
  .star{width:34px;height:34px;border:0;background:none;color:var(--faint);cursor:pointer;font-size:18px;}

  .ph{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:0 0 12px;}
  .hint{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:6px 0 0;}
  /* flat A2 profile */
  .chart{position:relative;height:150px;display:flex;align-items:flex-end;gap:2px;border-bottom:1px solid var(--rule);}
  .chart i{flex-grow:var(--g,1);background:color-mix(in srgb,var(--c) 46%,transparent);}
  .axis{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.06em;color:var(--faint);margin-top:6px;}

  /* layouts */
  .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,460px);gap:48px;align-items:start;}
  .meta-tr{text-align:right;font-size:12px;color:var(--dim);line-height:1.8;margin-bottom:14px;}
  .meta-tr .zbadge{justify-content:flex-end;}
  .namerow{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:6px;}
  .subrow{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
  .header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--rule);margin-bottom:22px;}
  .header .hmeta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;color:var(--dim);font-size:12.5px;}
</style>
</head>
<body>
  <div class="chrome">
    <span class="t">Detail card layout</span>
    <span class="seg" id="seg">
      <button data-d="now" class="on">Now</button>
      <button data-d="a">A · Tidy columns</button>
      <button data-d="b">B · Header band</button>
      <button data-d="c">C · Profile-forward</button>
      <button data-d="d">D · Spec grid</button>
    </span>
    <button class="tgl" id="theme">Dark</button>
  </div>
  <div class="stage">
    <p class="cap" id="cap"></p>
    <div id="mount"></div>
  </div>
<script>
  var SPICE = 4;
  function spice(){ var s=''; for(var i=0;i<5;i++) s+='<b class="'+(i<SPICE?'':'off')+'"></b>'; return '<span class="spice" title="Spice '+SPICE+'/5">'+s+'</span>'; }
  // flat profile blocks: [zoneVar, minutes(width), height%]
  var BLOCKS=[['endurance',3,34],['endurance',3,46],['endurance',2,58],['tempo',18,86],['rec',4,30],['tempo',18,86],['rec',4,30],['tempo',18,86],['endurance',2,56],['endurance',3,42],['endurance',2,30]];
  function chart(){ return '<div class="chart">'+BLOCKS.map(function(b){return '<i style="--g:'+b[1]+';--c:var(--'+b[0]+');height:'+b[2]+'%"></i>';}).join('')+'</div><div class="axis"><span>0 min</span><span>90 min</span></div>'; }
  var SPECS=[['Duration','90','min'],['Time in zone','54','min'],['TSS','92',''],['Est. avg power','162','W'],['Normalised','172','W']];
  function specs(cls){ return '<div class="specs '+(cls||'')+'">'+SPECS.map(function(s){return '<span class="s"><span class="k">'+s[0]+'</span><span class="v">'+s[1]+(s[2]?'<u>'+s[2]+'</u>':'')+'</span></span>';}).join('')+'</div>'; }
  var NAME='<h2 class="name">Anvilstone</h2>';
  var ZB='<span class="zbadge"><i></i>Tempo</span>';
  var CUE='<p class="cue">Sustained tempo — aerobic strength held at a hard-but-steady pace.</p>';
  var ACT='<div class="act"><button class="start">▶ Start Workout</button><button class="star">☆</button></div>';
  var PROF='<div class="ph">Profile</div>'+chart()+'<p class="hint">Hover for each block’s target.</p>';

  var T={
    now:function(){return '<div class="card"><div class="two"><div class="lead">'+NAME+
      '<div class="subrow" style="margin:10px 0 0"><span class="chip">3 × 18 min @ 191w</span>'+spice()+'</div>'+
      CUE+specs()+ACT+'</div><div class="prof">'+
      '<div class="meta-tr">'+ZB+'<div>90 min · TSS 92</div><div>3 × 18 min @ 191w</div></div>'+
      PROF+'</div></div></div>';},
    a:function(){return '<div class="card"><div class="two"><div class="lead">'+
      '<div class="namerow">'+NAME+ZB+'</div>'+
      '<div class="subrow"><span class="struct">3 × 18 min @ 191w</span>'+spice()+'</div>'+
      CUE+specs()+ACT+'</div><div class="prof">'+PROF+'</div></div></div>';},
    b:function(){return '<div class="card">'+
      '<div class="header"><div class="namerow" style="margin:0">'+NAME+ZB+'</div>'+
      '<div class="hmeta"><span class="struct">3 × 18 min @ 191w</span>'+spice()+'</div></div>'+
      '<div class="two"><div class="lead">'+CUE+specs()+ACT+'</div><div class="prof">'+PROF+'</div></div></div>';},
    c:function(){return '<div class="card">'+
      '<div class="header"><div class="namerow" style="margin:0">'+NAME+ZB+'</div>'+
      '<div class="hmeta"><span class="struct">3 × 18 min @ 191w</span>'+spice()+'</div></div>'+
      CUE+'<div class="ph">Profile</div>'+chart()+'<p class="hint">Hover for each block’s target.</p>'+
      specs('strip')+'<div style="margin-top:22px">'+ACT+'</div></div>';},
    d:function(){return '<div class="card"><div class="two"><div class="lead">'+
      '<div class="namerow">'+NAME+ZB+'</div>'+
      '<div class="subrow"><span class="struct">3 × 18 min @ 191w</span>'+spice()+'</div>'+
      CUE+specs('grid')+'<div style="margin-top:22px">'+ACT+'</div></div><div class="prof">'+PROF+'</div></div></div>';}
  };
  var CAP={
    now:'<b>Now.</b> The structure (3×18min@191w) shows twice and the zone/duration/TSS repeats in the right-hand meta — which reads as clutter.',
    a:'<b>A · Tidy columns.</b> Same two-column spread, de-duplicated: zone badge sits beside the name, the structure appears once, and the redundant right-hand meta is gone. Smallest change.',
    b:'<b>B · Header band.</b> Name + zone + structure form one aligned header line with a rule under it; cue + specs on the left, profile on the right. Clear top, scannable.',
    c:'<b>C · Profile-forward.</b> Header, then the profile goes full-width as the hero, with the five specs as a tidy strip beneath it. Best when the shape is what you glance at first.',
    d:'<b>D · Spec grid.</b> Like A, but the five numbers sit in a bordered grid (matches the live screen) — the most organised, instrument-panel read of the stats.'
  };
  function show(d){ document.getElementById('mount').innerHTML=T[d](); document.getElementById('cap').innerHTML=CAP[d]; }
  document.getElementById('seg').addEventListener('click',function(e){var b=e.target.closest('button[data-d]');if(!b)return;[].forEach.call(this.children,function(x){x.classList.toggle('on',x===b);});show(b.getAttribute('data-d'));});
  document.getElementById('theme').addEventListener('click',function(){var d=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',d);this.textContent=d==='light'?'Dark':'Light';});
  show('now');
</script>
</body>
</html>
